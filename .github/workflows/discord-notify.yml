name: Discord Notify

# 置き場所: .github/workflows/discord-notify.yml
# 必要な設定: リポジトリの Secrets に DISCORD_WEBHOOK_URL を登録

on:
  # fork からのPRでも通知したいので pull_request_target を使う
  # (このworkflowはコードをcheckoutせず、メタデータを読むだけなので安全)
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [opened, assigned]
  workflow_run:
    # ↓ 通知対象のCI workflowの name: に合わせて書き換える
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  # ---------- PR作成 / 再オープン / Draft解除 ----------
  pr-opened:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          case "$ACTION" in
            opened)           LABEL="新しいPR" ;;
            reopened)         LABEL="PR再オープン" ;;
            ready_for_review) LABEL="レビュー待ちになったPR" ;;
            *)                LABEL="PR" ;;
          esac
          jq -n \
            --arg label "$LABEL" --arg num "$NUMBER" --arg title "$TITLE" \
            --arg url "$URL" --arg author "$AUTHOR" --arg repo "$REPO" \
            '{embeds: [{
               title: "🔔 \($label): #\($num) \($title)",
               url: $url,
               description: "by \($author)",
               footer: {text: $repo},
               color: 3447003
             }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  # ---------- PRマージ ----------
  pr-merged:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg num "$NUMBER" --arg title "$TITLE" --arg url "$URL" \
            --arg author "$AUTHOR" --arg base "$BASE" --arg repo "$REPO" \
            '{embeds: [{
               title: "✅ マージ: #\($num) \($title)",
               url: $url,
               description: "\($author) のPRが `\($base)` にマージされたよ。pullしておこう",
               footer: {text: $repo},
               color: 5763719
             }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  # ---------- Issue作成 ----------
  issue-opened:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg num "$NUMBER" --arg title "$TITLE" --arg url "$URL" \
            --arg author "$AUTHOR" --arg repo "$REPO" \
            '{embeds: [{
               title: "📝 新しいIssue: #\($num) \($title)",
               url: $url,
               description: "by \($author)",
               footer: {text: $repo},
               color: 16705372
             }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  # ---------- Issueアサイン ----------
  issue-assigned:
    if: github.event_name == 'issues' && github.event.action == 'assigned'
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg num "$NUMBER" --arg title "$TITLE" --arg url "$URL" \
            --arg assignee "$ASSIGNEE" --arg repo "$REPO" \
            '{embeds: [{
               title: "👤 アサイン: #\($num) \($title)",
               url: $url,
               description: "担当: \($assignee)",
               footer: {text: $repo},
               color: 10181046
             }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  # ---------- CI失敗(デフォルトブランチのみ) ----------
  ci-failed:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg name "$NAME" --arg url "$URL" --arg branch "$BRANCH" \
            --arg actor "$ACTOR" --arg repo "$REPO" \
            '{embeds: [{
               title: "❌ CI失敗: \($name) (\($branch))",
               url: $url,
               description: "実行者: \($actor)\n`\($branch)` のビルドが落ちてるよ",
               footer: {text: $repo},
               color: 15548997
             }]}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
